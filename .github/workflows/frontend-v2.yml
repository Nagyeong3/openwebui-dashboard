name: Frontend v2
on:
  push:
    paths: ['frontend-v2/**', '.github/workflows/frontend-v2.yml']
  pull_request:
    paths: ['frontend-v2/**', '.github/workflows/frontend-v2.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-v2-static
          path: frontend-v2/dist

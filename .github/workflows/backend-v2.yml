name: Backend v2
on:
  push:
    paths: ['backend_v2/**', '.github/workflows/backend-v2.yml']
  pull_request:
    paths: ['backend_v2/**', '.github/workflows/backend-v2.yml']
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend_v2/requirements*.txt
            backend_v2/constraints.txt
      - run: python -m pip install -r backend_v2/requirements-test.txt
      - run: python -m unittest discover -s backend_v2/tests -v
